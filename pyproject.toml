[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-stack-hackernews"
version = "0.1.0"
description = "Hacker News as a source for the Aegis Stack research service"
authors = [{ name = "Leonard Bedner" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["aegis-stack", "aegis-stack-plugin", "hacker-news", "research"]
dependencies = [
    "aegis-stack>=0.14.0",
]

[project.urls]
"Aegis Plugin" = "https://aegis-stack.io/plugins/aegis-stack-hackernews"
"Hacker News API" = "https://hn.algolia.com/api"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.7.0",
]

[project.entry-points."aegis.plugins"]
hackernews = "aegis_stack_hackernews.plugin:get_spec"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_stack_hackernews"]

[tool.ruff]
line-length = 88
target-version = "py311"
# The template renders into a generated project and is linted there, under
# that project's rules (its first-party ``app`` package, its import order).
extend-exclude = ["src/*/templates"]

[tool.pytest.ini_options]
# The template's own tests run inside a generated project; these pin the spec.
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
